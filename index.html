<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animora v3</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#0f1117;
  color:white;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
}

.card{
  background:#1a1d29;
  border-radius:14px;
  overflow:hidden;
}

.thumb{
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:#252a3d;
}

.cardbody{
  padding:12px;
}

.cta{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<h1>Animora v3</h1>

<div class="grid" id="exploreGrid"></div>

<div id="toast"></div>

<script>
const items = [
["Anime Hero Rig","♟"],
["Dark Fantasy Environments","☾"],
["Action Moves Pack","✦"],
["Neon City","⌁"],
["Magic Effects","✧"],
["Stylized Nature","◈"]
];

function renderAssets(){
  let html="";

  items.forEach(item=>{
    html += `
      <div class="card">
        <div class="thumb">${item[1]}</div>

        <div class="cardbody">
          <h3>${item[0]}</h3>

          <button class="cta"
          onclick="addToLibrary('${item[0]}')">
          Add To Library
          </button>
        </div>
      </div>
    `;
  });

  document.getElementById("exploreGrid").innerHTML = html;
}

function addToLibrary(name){
  let library =
    JSON.parse(localStorage.getItem("animora_library")) || [];

  if(!library.includes(name)){
    library.push(name);
    localStorage.setItem(
      "animora_library",
      JSON.stringify(library)
    );
  }

  showToast(name + " added to library");
}

function showToast(text){
  const toast=document.getElementById("toast");

  toast.innerText=text;
  toast.style.display="block";

  setTimeout(()=>{
    toast.style.display="none";
  },2000);
}

renderAssets();
</script>

</body>
</html>
