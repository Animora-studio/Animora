<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animora v3</title>
  
<style>
#welcomeScreen{
  text-align:center;
  max-width:500px;
  margin:80px auto;
  padding:30px 20px;
  display:block;
}

.welcomeIcon{
  font-size:80px;
  margin-bottom:20px;
}

#welcomeScreen h1{
  font-size:32px;
  margin-bottom:12px;
}

#welcomeScreen p{
  opacity:0.7;
  line-height:1.6;
  margin-bottom:30px;
}

#welcomeScreen .cta{
  font-size:16px;
  font-weight:bold;
  padding:14px;
}
  body{
  margin:0;
  padding:20px;
  background:#0f1117;
  color:white;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
}

.card{
  background:#1a1d29;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #292d3d;
  transition:transform 0.2s, box-shadow 0.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 25px rgba(0,0,0,0.35);
}

.thumb{
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  background:linear-gradient(135deg,#252a3d,#171a24);
}

.cardbody{
  padding:14px;
}

.cardbody h3{
  margin:0 0 12px;
  font-size:16px;
  line-height:1.3;
}

.cardbody small{
  display:block;
  margin-bottom:6px;
  font-size:10px;
  letter-spacing:1.2px;
  opacity:0.6;
}

.cta{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

  #assetDetail{
  max-width:600px;
  margin:20px auto;
}

#assetDetail .thumb{
  height:220px;
  font-size:80px;
  border-radius:16px;
  margin:20px 0;
}

#assetDetail h2{
  font-size:26px;
  margin:15px 0 8px;
}

#assetDetail p{
  line-height:1.6;
  opacity:0.75;
  margin-bottom:20px;
}

#assetDetail .cta{
  margin-bottom:10px;
  font-size:15px;
  font-weight:bold;
}

  #assetDetail .cta:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 15px rgba(0,0,0,0.3);
  }
  
#toast{
  position:fixed;
  bottom:80px;
z-index:9999;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  display:none;
}
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-around;
  padding:10px 5px;
  background:#171a24;
  border-top:1px solid #292d3d;
}

.bottom-nav button{
  background:none;
  border:none;
  color:white;
  font-size:13px;
  cursor:pointer;
}

.bottom-nav span{
  display:block;
  margin-top:4px;
}

.profile-header{
  text-align:center;
  padding:30px 20px 20px;
}

.profile-avatar{
  width:90px;
  height:90px;
  margin:0 auto 15px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  background:linear-gradient(135deg,#252a3d,#171a24);
  border:1px solid #292d3d;
}

.profile-header h2{
  margin:10px 0 5px;
  font-size:26px;
}

.profile-header p{
  opacity:0.65;
  margin:0;
}

.profile-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin:15px 0 20px;
}

.profile-stat{
  background:#1a1d29;
  border:1px solid #292d3d;
  border-radius:14px;
  padding:20px;
  text-align:center;
}

.profile-stat strong{
  display:block;
  font-size:28px;
  margin-bottom:5px;
}

.profile-stat span{
  opacity:0.65;
  font-size:13px;
}

.profile-card{
  margin-bottom:30px;
}
  
</style>
</head>

<body>

  <div id="welcomeScreen">
  <div class="welcomeIcon">🎬</div>

  <h1>Welcome to Animora</h1>

  <p>Discover beautiful animation assets for your next creative project.</p>

  <button class="cta" onclick="showExplore()">
    Explore Animora ✨
  </button>
  </div>

  <div id="appContent" style="display:none;">
    
<h1>Animora v3</h1>

<button onclick="showLibrary()" class="cta">
  📚 My Library
</button>

<br><br>

<div id="library" style="display:none;"></div>
  
<div id="favorites" style="display:none;"></div>

<div id="profile" style="display:none;"></div>
  
  <input
  type="text"
  id="searchBox"
  placeholder="Search assets..."
  oninput="searchAssets()"
  style="width:100%;padding:12px;border-radius:10px;border:none;margin-bottom:15px;">

  <div class="grid" id="exploreGrid"></div>

<div id="assetDetail" style="display:none;">
  <button class="cta" onclick="closeAssetDetail()">← Back</button>

  <div class="thumb" id="detailThumb"></div>

  <h2 id="detailTitle"></h2>
  <p id="detailDescription"></p>

  <button class="cta" id="detailLibraryButton">
    📚 Add To Library
  </button>

  <button class="cta" id="detailFavoriteButton">
  ❤️ Add To Favorites
</button>
</div>

<div id="toast"></div>
  
  </div>
  
<script>
const items = [
  ["Anime Hero Rig","♟"],
  ["Dark Fantasy Environments","☾"],
  ["Action Moves Pack","✦"],
  ["Neon City","⌁"],
  ["Magic Effects","✧"],
  ["Stylized Nature","◈"]
];

const descriptions = {
  "Anime Hero Rig":"A character rig designed for expressive animated movement.",
  "Dark Fantasy Environments":"Dark atmospheric environments for fantasy animation.",
  "Action Moves Pack":"Dynamic movement and action animation assets.",
  "Neon City":"A futuristic neon-filled city environment.",
  "Magic Effects":"Visual effects for spells, magic, and energy.",
  "Stylized Nature":"Stylized natural environments and scenery."
};
   
    function showExplore(){
  document.getElementById("welcomeScreen").style.display = "none";
  document.getElementById("appContent").style.display = "block";

  document.getElementById("assetDetail").style.display = "none";

  const library = document.getElementById("library");
  library.innerHTML = "";
  library.style.display = "none";

  document.getElementById("favorites").style.display = "none";
  document.getElementById("profile").style.display = "none";
  document.getElementById("searchBox").style.display = "block";
  document.getElementById("exploreGrid").style.display = "grid";

  renderAssets();
    }
  
function renderAssets(){
  document.getElementById("assetDetail").style.display="none";
  document.getElementById("library").style.display="none";
  document.getElementById("exploreGrid").style.display="grid";

  let html="";

  const filteredItems = window.currentItems || items;

  filteredItems.forEach(item=>{
    html += `
      <div class="card">
        <div class="thumb">${item[1]}</div>

        <div class="cardbody">
          <small>ANIMATION ASSET</small>
          <h3>${item[0]}</h3>

          <button class="cta"
          onclick="openAssetDetail('${item[0]}','${getAssetIcon(item[0])}')">
          View Details
          </button>

          <button class="cta"
          onclick="addToLibrary('${item[0]}')">
          Add To Library
          </button>
       
        <button class="cta"
onclick="addToFavorites('${item[0]}')">
❤️ Add To Favorites
</button>
        </div>
      </div>
    `;
  });

  document.getElementById("exploreGrid").innerHTML = html;
}
  

function addToLibrary(name){
  let library =
    JSON.parse(localStorage.getItem("animora_library")) || [];

  if(!library.includes(name)){
    library.push(name);
    localStorage.setItem(
      "animora_library",
      JSON.stringify(library)
    );
  }

  showToast(name + " added to library");
}

  function addToFavorites(name){
  let favorites =
    JSON.parse(localStorage.getItem("animora_favorites")) || [];

  if(!favorites.includes(name)){
    favorites.push(name);
    localStorage.setItem(
      "animora_favorites",
      JSON.stringify(favorites)
    );
  }

  showToast(name + " added to favorites");
  }
 
  function removeFromFavorites(name){
  let favorites =
    JSON.parse(localStorage.getItem("animora_favorites")) || [];

  favorites = favorites.filter(item => item !== name);

  localStorage.setItem(
    "animora_favorites",
    JSON.stringify(favorites)
  );

  showToast(name + " removed from favorites");

  showFavorites();
  }
  
  function openAssetDetail(name, icon){
  document.getElementById("exploreGrid").style.display="none";
  document.getElementById("library").style.display="none";

  document.getElementById("assetDetail").style.display="block";

  document.getElementById("detailThumb").innerText=icon;
  document.getElementById("detailTitle").innerText=name;
  document.getElementById("detailDescription").innerText=descriptions[name];

    document.getElementById("detailLibraryButton").onclick=function(){
    addToLibrary(name);
  };

  document.getElementById("detailFavoriteButton").onclick=function(){
    addToFavorites(name);
  };
  }
  
function closeAssetDetail(){
  document.getElementById("assetDetail").style.display="none";
  document.getElementById("exploreGrid").style.display="grid";
}
  
function showToast(text){
  const toast=document.getElementById("toast");

  toast.innerText=text;
  toast.style.display="block";

  setTimeout(()=>{
    toast.style.display="none";
  },2000);
}

  function getAssetIcon(name){
  const asset = items.find(item => item[0] === name);
  return asset ? asset[1] : "📦";
  }
  function showLibrary(){
    const library =
    JSON.parse(localStorage.getItem("animora_library")) || [];

  const box = document.getElementById("library");

box.style.display = "block";
document.getElementById("exploreGrid").style.display = "none";
document.getElementById("assetDetail").style.display = "none";
document.getElementById("favorites").style.display = "none";
document.getElementById("searchBox").style.display = "none";
    
  if(library.length === 0){
    box.innerHTML = "<p>Your library is empty.</p>";
    return;
  }

  box.innerHTML =
  "<h2>My Library</h2>" +
  `<div class="grid">` +
  library.map(item => `
    <div class="card">
      <div class="thumb">${getAssetIcon(item)}</div>
      <div class="cardbody">
        <h3>${item}</h3>
        <button class="cta"
onclick="openAssetDetail('${item}','${getAssetIcon(item)}')">
View Details
</button>
      </div>
    </div>
  `).join("") +
    `</div>`;
}

  function showFavorites(){
  const favorites =
    JSON.parse(localStorage.getItem("animora_favorites")) || [];

  const box = document.getElementById("favorites");

  box.style.display = "block";
  document.getElementById("library").style.display = "none";
  document.getElementById("exploreGrid").style.display = "none";
  document.getElementById("assetDetail").style.display = "none";
document.getElementById("searchBox").style.display = "none";
    
  if(favorites.length === 0){
    box.innerHTML = "<p>Your favorites are empty.</p>";
    return;
  }

  box.innerHTML =
  "<h2>Favorites</h2>" +
  `<div class="grid">` +
  favorites.map(item => `
    <div class="card">
      <div class="thumb">${getAssetIcon(item)}</div>
      <div class="cardbody">
        <h3>❤️ ${item}</h3>
        <button class="cta"
onclick="openAssetDetail('${item}','${getAssetIcon(item)}')">
View Details
</button>

<button class="cta"
onclick="removeFromFavorites('${item}')">
💔 Remove from Favorites
</button>
      </div>
    </div>
  `).join("") +
  `</div>`;
  }

  function showProfile(){
  const library =
    JSON.parse(localStorage.getItem("animora_library")) || [];

  const favorites =
    JSON.parse(localStorage.getItem("animora_favorites")) || [];

  const box = document.getElementById("profile");

  box.style.display = "block";
  document.getElementById("library").style.display = "none";
  document.getElementById("favorites").style.display = "none";
  document.getElementById("exploreGrid").style.display = "none";
  document.getElementById("assetDetail").style.display = "none";
  document.getElementById("searchBox").style.display = "none";

  const username =
    localStorage.getItem("animora_username") || "Animora Creator";

  box.innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar">👤</div>

      <h2>${username}</h2>

      <p>Welcome back to Animora ✨</p>
    </div>

    <div class="profile-stats">

      <div class="profile-stat">
        <strong>${library.length}</strong>
        <span>Library</span>
      </div>

      <div class="profile-stat">
        <strong>${favorites.length}</strong>
        <span>Favorites</span>
      </div>

    </div>

    <div class="card profile-card">
      <div class="cardbody">

        <h3>👤 Account</h3>

        <button class="cta" onclick="editUsername()">
          ✏️ Edit Username
        </button>

        <p>✨ Member Since: September 2026</p>

      </div>
    </div>
  `;
  }

  function editUsername(){
  const currentName =
    localStorage.getItem("animora_username") || "Animora Creator";

  const newName = prompt(
    "Enter your new username:",
    currentName
  );

  if(newName && newName.trim() !== ""){
    localStorage.setItem(
      "animora_username",
      newName.trim()
    );

    showProfile();
    showToast("Username updated!");
  }
  }
  
  function searchAssets(){
  const term =
    document.getElementById("searchBox")
    .value
    .toLowerCase();

  window.currentItems = items.filter(item =>
    item[0].toLowerCase().includes(term)
  );

  renderAssets();
  }
renderAssets();
</script>

  <nav class="bottom-nav">
  <button onclick="showExplore()">🎬<span>Explore</span></button>
  <button onclick="showLibrary()">📚<span>Library</span></button>
  <button onclick="showFavorites()">❤️<span>Favorites</span></button>
  <button onclick="showProfile()">👤<span>Profile</span></button>
</nav>
  
</body>
</html>
