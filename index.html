<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animora v3</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#0f1117;
  color:white;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
}

.card{
  background:#1a1d29;
  border-radius:14px;
  overflow:hidden;
}

.thumb{
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:#252a3d;
}

.cardbody{
  padding:12px;
}

.cta{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#toast{
  position:fixed;
  bottom:80px;
z-index:9999;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  display:none;
}
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-around;
  padding:10px 5px;
  background:#171a24;
  border-top:1px solid #292d3d;
}

.bottom-nav button{
  background:none;
  border:none;
  color:white;
  font-size:13px;
  cursor:pointer;
}

.bottom-nav span{
  display:block;
  margin-top:4px;
}
  
</style>
</head>

<body>

<h1>Animora v3</h1>

<button onclick="showLibrary()" class="cta">
  📚 My Library
</button>

<br><br>

<div id="library"></div>

<div class="grid" id="exploreGrid"></div>

<div id="assetDetail" style="display:none;">
  <button class="cta" onclick="closeAssetDetail()">← Back</button>

  <div class="thumb" id="detailThumb"></div>

  <h2 id="detailTitle"></h2>
  <p id="detailDescription"></p>

  <button class="cta" id="detailLibraryButton">
    📚 Add To Library
  </button>
</div>

<div id="toast"></div>

<script>
const items = [
  ["Anime Hero Rig","♟"],
  ["Dark Fantasy Environments","☾"],
  ["Action Moves Pack","✦"],
  ["Neon City","⌁"],
  ["Magic Effects","✧"],
  ["Stylized Nature","◈"]
];

const descriptions = {
  "Anime Hero Rig":"A character rig designed for expressive animated movement.",
  "Dark Fantasy Environments":"Dark atmospheric environments for fantasy animation.",
  "Action Moves Pack":"Dynamic movement and action animation assets.",
  "Neon City":"A futuristic neon-filled city environment.",
  "Magic Effects":"Visual effects for spells, magic, and energy.",
  "Stylized Nature":"Stylized natural environments and scenery."
};

function renderAssets(){
  let html="";

  items.forEach(item=>{
    html += `
      <div class="card">
        <div class="thumb">${item[1]}</div>

        <div class="cardbody">
          <h3>${item[0]}</h3>

<button class="cta"
onclick="openAssetDetail('${item[0]}','${item[1]}')">
View Details
</button>

          <button class="cta"
          onclick="addToLibrary('${item[0]}')">
          Add To Library
          </button>
        </div>
      </div>
    `;
  });

  document.getElementById("exploreGrid").innerHTML = html;
}

function addToLibrary(name){
  let library =
    JSON.parse(localStorage.getItem("animora_library")) || [];

  if(!library.includes(name)){
    library.push(name);
    localStorage.setItem(
      "animora_library",
      JSON.stringify(library)
    );
  }

  showToast(name + " added to library");
}

function openAssetDetail(name, icon){
  document.getElementById("exploreGrid").style.display="none";
  document.getElementById("library").style.display="none";

  document.getElementById("assetDetail").style.display="block";

  document.getElementById("detailThumb").innerText=icon;
  document.getElementById("detailTitle").innerText=name;
  document.getElementById("detailDescription").innerText=descriptions[name];

  document.getElementById("detailLibraryButton").onclick=function(){
    addToLibrary(name);
  };
}

function closeAssetDetail(){
  document.getElementById("assetDetail").style.display="none";
  document.getElementById("exploreGrid").style.display="grid";
}
  
function showToast(text){
  const toast=document.getElementById("toast");

  toast.innerText=text;
  toast.style.display="block";

  setTimeout(()=>{
    toast.style.display="none";
  },2000);
}

  function getAssetIcon(name){
  const asset = items.find(item => item[0] === name);
  return asset ? asset[1] : "📦";
  }
  function showLibrary(){
    const library =
    JSON.parse(localStorage.getItem("animora_library")) || [];

  const box = document.getElementById("library");

  if(library.length === 0){
    box.innerHTML = "<p>Your library is empty.</p>";
    return;
  }

  box.innerHTML =
  "<h2>My Library</h2>" +
  `<div class="grid">` +
  library.map(item => `
    <div class="card">
      <div class="thumb">${getAssetIcon(item)}</div>
      <div class="cardbody">
        <h3>${item}</h3>
        <button class="cta"
        onclick="openAssetDetail('${item}','${getAssetIcon(item)}')"
        View Details
        </button>
      </div>
    </div>
  `).join("") +
    `</div>`;
}

renderAssets();
</script>

  <nav class="bottom-nav">
  <button onclick="renderAssets()">🎬<span>Explore</span></button>
  <button onclick="showLibrary()">📚<span>Library</span></button>
  <button onclick="showToast('Favorites coming soon')">❤️<span>Favorites</span></button>
</nav>
  
</body>
</html>
