<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animora v2</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#08070d;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

header span{
  color:#9b6cff;
}

.container{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:16px;
}

.card{
  background:#11101a;
  border:1px solid #272131;
  border-radius:18px;
  overflow:hidden;
}

.thumb{
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  background:linear-gradient(135deg,#24114a,#5d32c7);
}

.cardbody{
  padding:15px;
}

.cardbody h3{
  margin-bottom:8px;
}

.cta{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  background:#7342f5;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  color:black;
  padding:12px 20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<header>
Ani<span>mora</span>
</header>

<div class="container">

<h2>Explore Assets</h2>

<div class="grid" id="exploreGrid"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const items = [
["Anime Hero Rig","♟"],
["Dark Fantasy Environments","☾"],
["Action Moves Pack","✦"],
["Neon City","⌁"],
["Magic Effects","✧"],
["Stylized Nature","◈"]
];

function renderAssets(){
  let html="";

  items.forEach(item=>{
    html += `
      <div class="card">
        <div class="thumb">${item[1]}</div>

        <div class="cardbody">
          <h3>${item[0]}</h3>

          <button class="cta"
            onclick="addToLibrary('${item[0]}')">
            Add To Library
          </button>
        </div>
      </div>
    `;
  });

  document.getElementById("exploreGrid").innerHTML = html;
}

  function addToLibrary(name){
  let library = JSON.parse(localStorage.getItem("animora_library")) || [];

  if (!library.includes(name)) {
    library.push(name);
    localStorage.setItem("animora_library", JSON.stringify(library));
  }

  showToast(name + " added to library");
  }

function showToast(text){
  const toast=document.getElementById("toast");

  toast.innerText=text;
  toast.style.display="block";

  setTimeout(()=>{
    toast.style.display="none";
  },2000);
}

renderAssets();
</script>

</body>
</html>
